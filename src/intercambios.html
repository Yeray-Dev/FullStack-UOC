<!DOCTYPE html>
<html lang="es">
<head>
	<!-- configuración de la página -->
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Intercambios · Tándem</title>

	<!-- bootstrap -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

	<!-- estilos -->
	<link href="../css/intercambios.css" rel="stylesheet">

	<!-- lógica de la página -->
	<script type="module" src="../js/intercambios.js"></script>
</head>
<body class="container py-4">
	<!-- menú -->
	<nav class="mb-4">
		<a href="dashboard.html">Tablón</a> |
		<a href="intercambios.html">Intercambios</a> |
		<a href="usuarios.html">Usuarios</a> |
		<a href="login.html">Entrar</a>
	</nav>

	<!-- título -->
	<h1>Intercambios</h1>

	<!-- formulario -->
	<h2 class="fs-4 mt-4">Nuevo intercambio</h2>
	<form id="exchange-form">
		<!-- tipo -->
		<div class="mb-3">
			<label><input type="radio" name="type" value="offer" checked> Oferta</label>
			<label class="ms-3"><input type="radio" name="type" value="request"> Petición</label>
		</div>

		<!-- idioma -->
		<div class="mb-3">
			<label for="language" class="form-label">Idioma</label>
			<select id="language" name="language" class="form-select" required>
				<option value="">Elige</option>
			</select>
		</div>

		<!-- nivel -->
		<div class="mb-3">
			<label for="level" class="form-label">Nivel</label>
			<select id="level" name="level" class="form-select" required>
				<option value="">Elige</option>
			</select>
		</div>

		<!-- a cambio de -->
		<div class="mb-3">
			<label for="exchange" class="form-label">A cambio de</label>
			<select id="exchange" name="exchange" class="form-select" required>
				<option value="">Elige</option>
			</select>
		</div>

		<!-- modalidad -->
		<div class="mb-3">
			<p class="mb-1">Modalidad</p>
			<label><input type="radio" name="modality" value="in-person" checked> Presencial</label>
			<label class="ms-3"><input type="radio" name="modality" value="online"> Online</label>
			<label class="ms-3"><input type="radio" name="modality" value="both"> Ambas</label>
		</div>

		<!-- descripción -->
		<div class="mb-3">
			<label for="description" class="form-label">Descripción</label>
			<textarea id="description" name="description" class="form-control" rows="3" required></textarea>
		</div>

		<!-- enviar -->
		<button type="submit" class="btn btn-dark">Publicar</button>
	</form>

	<!-- tabla -->
	<h2 class="fs-4 mt-5">Intercambios publicados (<span id="exchange-count">0</span>)</h2>
	<table class="table">
		<thead>
			<tr>
				<th>Tipo</th>
				<th>Idioma</th>
				<th>Nivel</th>
				<th>A cambio de</th>
				<th>Modalidad</th>
				<th>Publicado</th>
				<th></th>
			</tr>
		</thead>
		<!-- filas -->
		<tbody id="exchange-table"></tbody>
	</table>
</body>
</html>
