<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Intercambios · Tándem</title>

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" rel="stylesheet">

	<link href="../css/base.css" rel="stylesheet">
	<link href="../css/dashboard.css" rel="stylesheet">
	<link href="../css/intercambios.css" rel="stylesheet">

	<script type="module" src="../js/intercambios.js"></script>
</head>
<body>
	<header class="navbar navbar-expand-lg sticky-top bg-white border-bottom">
		<div class="container-fluid px-4">
			<a class="navbar-brand d-flex align-items-center gap-2" href="dashboard.html">
				<img src="../media/logo.svg" alt="" width="28" height="28">
				Tándem
			</a>
			<button class="navbar-toggler" type="button"
					data-bs-toggle="collapse"
					data-bs-target="#mainMenu"
					aria-controls="mainMenu"
					aria-expanded="false"
					aria-label="Abrir menu">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div id="mainMenu" class="collapse navbar-collapse">
				<nav class="ms-lg-5">
					<ul class="navbar-nav gap-lg-3">
						<li class="nav-item"><a class="nav-link" href="dashboard.html">
							<i class="bi bi-grid-1x2" aria-hidden="true"></i>
								Tablón
							</a></li>
						<li class="nav-item"><a class="nav-link active" href="intercambios.html" aria-current="page">
							<i class="bi bi-arrow-left-right" aria-hidden="true"></i>
								Intercambios
							</a></li>
						<li class="nav-item"><a class="nav-link" href="usuarios.html">
							<i class="bi bi-people" aria-hidden="true"></i>
								Usuarios
							</a></li>
					</ul>
				</nav>
					<div class="d-flex ms-lg-auto align-items-center gap-lg-3">
						<span id="user-chip" class="d-none d-flex border rounded-5 shadow-sm p-2">
							<span id="user-initials" class="p-1 bg-black text-white rounded-circle"></span>
							<span id="user-email" class="p-1 small"></span>
						</span>
						<a href="./login.html" class="btn btn-logout">
						<i class="bi bi-box-arrow-right" aria-hidden="true"></i>
							Salir
					</a>
				</div>	

			</div>
		</div>
	</header>

	<main class="px-4 pt-4 pb-5">
		<header class="mb-4">
			<h1 class="fs-2 mb-2">Intercambios</h1>
			<p class="text-body-secondary small mb-0">Publica una oferta o una petición y gestiona las que ya tienes.</p>
		</header>

		<div class="row g-4 align-items-start">
			<section class="col-12 col-lg-4">
				<div class="card bg-white p-4">
					<h2 class="fs-5 mb-3">Nuevo intercambio</h2>

					<form id="exchange-form">
						<div class="mb-3">
							<p class="form-label">Tipo</p>
							<div class="d-flex gap-2">
								<input type="radio" class="btn-check" name="type" id="new-offer" value="offer" checked>
								<label class="btn btn-outline-dark rounded-3 flex-fill d-inline-flex align-items-center justify-content-center gap-2" for="new-offer">
									<i class="bi bi-circle-fill dot-offer"></i>Oferta
								</label>
								<input type="radio" class="btn-check" name="type" id="new-request" value="request">
								<label class="btn btn-outline-dark rounded-3 flex-fill d-inline-flex align-items-center justify-content-center gap-2" for="new-request">
									<i class="bi bi-circle-fill dot-request"></i>Petición
								</label>
							</div>
						</div>

						<div class="row g-3 mb-3">
							<div class="col-6">
								<label for="language" class="form-label">Idioma</label>
								<select id="language" name="language" class="form-select" required>
									<option value="">Elige</option>
								</select>
							</div>
							<div class="col-6">
								<label for="level" class="form-label">Nivel</label>
								<select id="level" name="level" class="form-select" required>
									<option value="">Elige</option>
								</select>
							</div>
						</div>

						<div class="mb-3">
							<label for="exchange" class="form-label">A cambio de</label>
							<select id="exchange" name="exchange" class="form-select" required>
								<option value="">Elige</option>
							</select>
						</div>

						<div class="mb-3">
							<p class="form-label">Modalidad</p>
							<div class="d-flex flex-wrap gap-2">
								<input type="radio" class="btn-check" name="modality" id="mod-in-person" value="in-person" checked>
								<label class="btn btn-outline-dark rounded-5" for="mod-in-person">Presencial</label>
								<input type="radio" class="btn-check" name="modality" id="mod-online" value="online">
								<label class="btn btn-outline-dark rounded-5" for="mod-online">Online</label>
								<input type="radio" class="btn-check" name="modality" id="mod-both" value="both">
								<label class="btn btn-outline-dark rounded-5" for="mod-both">Ambas</label>
							</div>
						</div>

						<div class="mb-4">
							<label for="description" class="form-label">Descripción</label>
							<textarea id="description" name="description" class="form-control" rows="3" placeholder="Cuéntale a los demás qué te gustaría hacer…" required></textarea>
						</div>

						<button type="submit" class="btn btn-dark w-100 py-2">
							<i class="bi bi-send me-2" aria-hidden="true"></i>Publicar
						</button>
					</form>
				</div>
			</section>

			<section class="col-12 col-lg-8">
				<div class="card bg-white ">
					<header class="card-header bg-white py-3 px-4">
						<h2 class="fs-5 mb-0">
							Intercambios publicados
							<span id="exchange-count" class="badge rounded-pill text-bg-light ms-1">0</span>
						</h2>
					</header>
					<div class=" table-responsive position-relative">
						<table class="table align-middle mb-0 exchanges-table">
							<thead>
								<tr>
									<th scope="col">Tipo</th>
									<th scope="col">Idioma</th>
									<th scope="col">Nivel</th>
									<th scope="col">A cambio de</th>
									<th scope="col">Modalidad</th>
									<th scope="col">Publicado</th>
									<th scope="col"><span class="visually-hidden">Acciones</span></th>
								</tr>
							</thead>
							<tbody id="exchange-table"></tbody>
						</table>
					</div>
				</div>
			</section>
		</div>
	</main>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
</body>
</html>
