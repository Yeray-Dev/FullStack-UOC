<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/login.css">
    <script type="module" src="../js/login.js" defer></script>
    <title>Login</title>
</head>
<body>
    <main class="container-fluid">
        <div class="row vh-100">
            <aside id="brand-pannel" class="col lg-6 d-none d-lg-flex flex-column p-5">
                <div class="d-flex align-items-center gap-2">
                    <img src="../media/logo.svg" alt="logotipo">
                    <p class="text-white m-0">Tándem</p>
                </div>
                <div class="my-auto">
                    <p class="display-3 fw-bold 1h-1 text-white">
                        Tú enseñas <br> el tuyo. <br>
                        Yo, el mío.
                    </p>
                    <p class="fs-5 text-white-50">
                        El tablón de intercambio de idiomas de tu campus. <br>
                        Publica lo que ofreces, encuentra lo que buscas.
                    </p>
                </div>
            </aside>
            <section id="login_pannel" class="col d-flex justify-content-center align-items-center px-3">
                <div class="w-100 login-box">
                    <h1>
                        Inicia sesión
                    </h1>
                    <p>
                        Usa tu email universitario.
                    </p>
                    <form>
                        <div class="d-flex row">
                            <label for="email" class="form-label">Email</label>
                            <div class="input-group">
                                <span class="input-group-text"> <i class="bi bi-envelope" aria-hidden="true"></i></span>
                                
                                <input type="email" name="email" id="email" placeholder="nombre@uni.es" class="form-control bg-white">
                            </div>
                        </div>
                        
                        <div class="d-flex row py-3">
                            <div class="d-flex justify-content-between">
                                <label for="password" class="form-label">Contraseña</label>
                                <a href="#">¿Has olvidado tu contraseña?</a>
                            </div>
                            <div class="input-group">
                                <span class="input-group-text"> <i class="bi bi-lock" aria-hidden="true"></i></span>
                                <input type="password" name="password" id="password" placeholder="*********" class="form-control bg-white">
                                <button type="button" class="btn btn-outline-secondary" id="toggle-password" aria-label="Mostrar contraseña">
                                    <i class="bi bi-eye" id="eye-icon" aria-hidden="true"></i>
                                </button>
                            </div>
                        </div>
                        
                        <div class="py-2 form-check">
                            <input type="checkbox" name="still" id="still" class="form-check-input">
                            <label for="still" class="form-check-label">Mantener sesión iniciada</label>
                        </div>
                        
                        <button id="btn-enter" type="button" class="btn btn-dark w-100 btn-lg mt-1 d-flex align-items-center justify-content-center gap-2">Entrar <i class="bi bi-arrow-right" aria-hidden="true"></i></button>
                    </form>
                    <p class=" d-flex justify-content-center gap-2 py-3">
                        ¿Aún no tienes cuenta?
                        <a href="">Regístrate</a>
                    </p>
                </div>
            </section>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
