
<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Tablón · Tándem</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
	<link href="../css/dashboard.css" rel="stylesheet">
	<script type="module" src="../js/dashboard.js"></script>
</head>
<body>
	<header>
		<a href=""><img src="" alt="">Tándem</a>
		<nav>
			<ul>
				<li><a href="" aria-current="page">Tablón</a></li>
				<li><a href="">Intercambios</a></li>
				<li><a href="">Usuarios</a></li>
			</ul>
		</nav>
		<div>
			<span>Correo</span>
			<button type="button">Salir</button>
		</div>
	</header>

	<main>
		<header>
			<div class="view-title">
				<h1>Tablón</h1>
				<p>Encuentra con quién practicar. 24 ofertas y 18 peticiones activas esta semana.</p>
			</div>
			<button type="button">+ Publicar intercambio</button>
		</header>

		<search>
			<form>
				<fieldset class="type-filter">
					<legend class="visually-hidden">Tipo de intercambio</legend>

					<input type="radio" name="type" id="type-all" value="all" checked class="visually-hidden">
					<label for="type-all">Todos</label>

					<input type="radio" name="type" id="type-offer" value="offer" class="visually-hidden">
					<label for="type-offer">Ofertas</label>

					<input type="radio" name="type" id="type-request" value="request" class="visually-hidden">
					<label for="type-request">Peticiones</label>
				</fieldset>

				<label for="language-filter" class="visually-hidden">Idioma</label>
				<select id="language-filter" name="language">
					<option value="">Todos los idiomas</option>
				</select>

				<label for="level-filter" class="visually-hidden">Nivel</label>
				<select id="level-filter" name="level">
					<option value="">Nivel</option>
				</select>

				<label for="modality-filter" class="visually-hidden">Modalidad</label>
				<select id="modality-filter" name="modality">
					<option value="">Modalidad</option>
				</select>

				<label for="search-filter" class="visually-hidden">Buscar</label>
				<input type="search" id="search-filter" name="q" placeholder="Buscar por nombre o facultad">
			</form>
		</search>

		<ul id="card-list" class="row g-4 list-unstyled">
			<!-- Tarjetas renderizadas por JS -->
		</ul>

		<template id="card-template">
			<li class="col-12 col-md-6 col-lg-4">
				<article class="card h-100">
					<header class="card-header">
						<span class="badge" data-field="type"></span>
						<time data-field="date"></time>
						<h2>
							<span data-field="language"></span>
							<span data-field="level"></span>
						</h2>
					</header>

					<div class="card-body">
						<p>A cambio de <strong data-field="exchange"></strong></p>
						<p data-field="description"></p>
						<p>
							<span data-field="modality"></span>
							<span data-field="availability"></span>
						</p>
					</div>

					<footer class="card-footer">
						<span data-field="initials"></span>
						<p data-field="user-name"></p>
						<p data-field="faculty"></p>
						<button type="button">Contactar</button>
					</footer>
				</article>
			</li>
		</template>
	</main>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
</body>
</html>
