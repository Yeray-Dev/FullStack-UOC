
<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Tablón · Tándem</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" rel="stylesheet">
	<link href="../css/base.css" rel="stylesheet">
	<link href="../css/dashboard.css" rel="stylesheet">
	<script type="module" src="../js/dashboard.js"></script>
</head>
<body>
	<header class="navbar navbar-expand-lg sticky-top bg-white border-bottom">
		<div class="container-fluid px-4">
			<a class="navbar-brand d-flex align-items-center  gap-2" href="dashboard.html">
				<img src="../media/logo.svg" alt="" width="28" height="28">
				Tándem
			</a>
			<button class="navbar-toggler" type="button"
					data-bs-toggle="collapse"
					data-bs-target="#mainMenu"
					aria-controls="mainMenu"
					aria-expanded="false"
					aria-label="Abrir menu">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div id="mainMenu" class="collapse navbar-collapse">
				<nav class="ms-lg-5">
					<ul class="navbar-nav gap-lg-3">
						<li class="nav-item"><a class="nav-link" href="" aria-current="page">
							<i class="bi bi-grid-1x2" aria-hidden="true"></i>
								Tablón
							</a></li>
						<li class="nav-item"><a class="nav-link" href="">
							<i class="bi bi-arrow-left-right" aria-hidden="true"></i>
								Intercambios
							</a></li>
						<li class="nav-item"><a class="nav-link" href="">
							<i class="bi bi-people" aria-hidden="true"></i>
								Usuarios
							</a></li>
					</ul>
				</nav>
				<div class="d-flex ms-lg-auto align-items-center gap-lg-3">
					<span class="d-flex border rounded-5 shadow-sm p-2">
						<span class="p-1 bg-black text-white rounded-circle">LM</span>
						<span class="p-1 small">lucia.martin@uni.es</span>
					</span>
					<button class="btn btn-logout" type="button">
						<i class="bi bi-box-arrow-right" aria-hidden="true"></i>
							Salir
						</button>
				</div>
			</div>
		</div>
	</header>

	<main class="px-4 pt-4">
		<header class="d-lg-flex align-items-center justify-content-between mb-4">
			<div>
				<h1 class="fs-2 mb-2">Tablón</h1>
				<p class="text-body-secondary small mb-0">Encuentra con quién practicar. 24 ofertas y 18 peticiones activas esta semana.</p>
			</div>
			<button type="button" class="btn btn-dark py-2 px-3 mt-auto rounded-3 bi-plus-lg"> Publicar intercambio</button>
		</header>

		<search class="py-4 d-lg-flex">
			<form>
				<fieldset class="type-filter">
					<legend class="visually-hidden">Tipo de intercambio</legend>

					<input type="radio" name="type" id="type-all" value="all" checked class="visually-hidden">
					<label for="type-all">Todos</label>

					<input type="radio" name="type" id="type-offer" value="offer" class="visually-hidden">
					<label for="type-offer">Ofertas</label>

					<input type="radio" name="type" id="type-request" value="request" class="visually-hidden">
					<label for="type-request">Peticiones</label>
				</fieldset>

				<label for="language-filter" class="visually-hidden">Idioma</label>
				<select id="language-filter" name="language">
					<option value="">Todos los idiomas</option>
				</select>

				<label for="level-filter" class="visually-hidden">Nivel</label>
				<select id="level-filter" name="level">
					<option value="">Nivel</option>
				</select>

				<label for="modality-filter" class="visually-hidden">Modalidad</label>
				<select id="modality-filter" name="modality">
					<option value="">Modalidad</option>
				</select>

				<label for="search-filter" class="visually-hidden">Buscar</label>
				<input type="search" id="search-filter" name="q" placeholder="Buscar por nombre o facultad">
			</form>
		</search>

		<ul id="card-list" class="row g-4 list-unstyled">
			<!-- Tarjetas renderizadas por JS -->
		</ul>

		<template id="card-template">
			<li class="col-12 col-md-6 col-lg-4">
				<article class="card h-100">
					<header class="card-header">
						<span class="badge" data-field="type"></span>
						<time data-field="date"></time>
						<h2>
							<span data-field="language"></span>
							<span data-field="level"></span>
						</h2>
					</header>

					<div class="card-body">
						<p>A cambio de <strong data-field="exchange"></strong></p>
						<p data-field="description"></p>
						<p>
							<span data-field="modality"></span>
							<span data-field="availability"></span>
						</p>
					</div>

					<footer class="card-footer">
						<span data-field="initials"></span>
						<p data-field="user-name"></p>
						<p data-field="faculty"></p>
						<button type="button">Contactar</button>
					</footer>
				</article>
			</li>
		</template>
	</main>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
</body>
</html>
