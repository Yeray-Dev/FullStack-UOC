        </div>

      <div style="display: flex; flex-direction: column; gap: 10px">
        <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: #6b6a66">Botones secundarios</span>
        <div style="display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end">

          <div style="display: flex; flex-direction: column; gap: 6px; align-items: flex-start"><button type="button" style="font: inherit; font-size: 14px; font-weight: 500; padding: 8px 14px; border-radius: 8px; border: 1px solid #005745; background: #d7f7ed; color: #1c1b19">Contactar</button><span style="font-size: 12px; color: #6b6a66">Hover en oferta</span></div>
        </div>

  for (const n of nodes) {
    if (n.nodeType === 3) {
      parent.appendChild(document.createTextNode(interp(n.nodeValue, scope)));
    } else if (n.nodeType === 1) {
      if (n.localName === 'template' && 'for' in n.dataset) {
        const list = lookup(n.dataset.for, scope) || [];
        list.forEach((item, i) => {
          const s = Object.create(scope);
          s[n.dataset.as] = item;
          s.$index = i;
          renderNodes(n.content.childNodes, s, parent);
        });
      } else if (n.localName === 'template' && 'if' in n.dataset) {
        if (lookup(n.dataset.if, scope)) renderNodes(n.content.childNodes, scope, parent);
      } else {
        const el = document.importNode(n, false);
        for (const attr of Array.from(n.attributes)) {
          if (!attr.value.includes('{{')) continue;
          const whole = attr.value.match(WHOLE);
          if (attr.name.startsWith('on') && whole) {
            el.removeAttribute(attr.name);
            const fn = lookup(whole[1], scope);
            if (typeof fn === 'function') el.addEventListener(attr.name.slice(2), fn);
          } else {
            el.setAttribute(attr.name, interp(attr.value, scope));
          }
        }
        renderNodes(n.childNodes, scope, el);
        parent.appendChild(el);
      }
    }
  }
}

const instances = {};
let current = 'Main';
const stage = document.getElementById('stage');

function mount(key, resetScroll) {
  if (!LOGIC[key]) return;
  current = key;
  if (!instances[key]) instances[key] = new LOGIC[key]();
  const inst = instances[key];
  const frag = document.createDocumentFragment();
  const style = document.createElement('style');
  style.textContent = document.getElementById('css-' + key).innerHTML;
  frag.appendChild(style);
  renderNodes(document.getElementById('tpl-' + key).content.childNodes, inst.renderVals(), frag);
  stage.replaceChildren(frag);
  document.querySelectorAll('.mk-bar nav a').forEach(a => {
    if (a.dataset.board === key) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  if (resetScroll) window.scrollTo(0, 0);
}

stage.addEventListener('submit', e => e.preventDefault());
window.addEventListener('hashchange', () => {
  const key = location.hash.slice(1);
  if (LOGIC[key]) mount(key, true);
});
